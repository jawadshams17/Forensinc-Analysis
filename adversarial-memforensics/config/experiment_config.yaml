# ============================================================
# Master Experiment Configuration
# Adversarial Robustness of Memory-Forensic Ensemble Classifiers
# ============================================================

project:
  name: "adversarial-memforensics"
  version: "0.1.0"
  description: >
    Evaluating adversarial robustness of memory-forensic ensemble
    classifiers under cloud-ephemeral truncated capture conditions.

# --- Dataset ---
dataset:
  name: "CIC-MalMem-2022"
  n_samples: 58596
  n_features: 55
  classes:
    - Benign
    - Ransomware
    - Spyware
    - Trojan
  source_url: "https://www.unb.ca/cic/datasets/malmem-2022.html"

# --- Ensemble Model (Paper 1 Architecture) ---
ensemble:
  voting: "soft"
  estimators:
    random_forest:
      n_estimators: 200
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
      random_state: 42
      n_jobs: -1
    xgboost:
      n_estimators: 200
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      use_label_encoder: false
      eval_metric: "mlogloss"
      tree_method: "hist"    # handles missing values natively
    lightgbm:
      n_estimators: 200
      max_depth: -1
      learning_rate: 0.1
      num_leaves: 31
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      verbose: -1

# --- Truncation Levels ---
truncation:
  levels: [1.0, 0.75, 0.50, 0.25, 0.10]
  labels: ["100%", "75%", "50%", "25%", "10%"]
  missing_value_encoding: "nan"   # NaN for features that cannot be computed

# --- Adversarial Perturbation ---
adversarial:
  # GAMMA-adapted optimizer settings
  optimizer:
    population_size: 20
    generations: 10
    mutation_probability: 0.2
    query_budget: 50
    cost_penalty_lambda: 0.1
    selection_ratio: 0.5        # top 50% survive
    max_sequence_length: 5

  # Perturbation primitives
  primitives:
    child_spawn:
      enabled: true
      scope: "core"
      n_processes_range: [5, 30]
      hold_time_range: [0.1, 2.0]
      binaries:
        - "hostname.exe"
        - "whoami.exe"
        - "systeminfo.exe"
        - "ipconfig.exe"
        - "tasklist.exe"
      target_features:
        - "pslist.nproc"
        - "pslist.avg_threads"
      risk_level: "low"

    dll_padding:
      enabled: true
      scope: "core"
      n_dlls_range: [3, 15]
      safe_dlls:
        - "advapi32.dll"
        - "shell32.dll"
        - "crypt32.dll"
        - "wintrust.dll"
        - "imagehlp.dll"
        - "version.dll"
        - "userenv.dll"
        - "winhttp.dll"
        - "urlmon.dll"
        - "mswsock.dll"
      target_features:
        - "dlllist.ndlls"
        - "dlllist.avg_dlls_per_proc"
      risk_level: "low-medium"

    handle_padding:
      enabled: true
      scope: "core"
      n_file_handles_range: [10, 50]
      n_reg_handles_range: [5, 25]
      target_features:
        - "handles.nhandles"
        - "handles.avg_handles_per_proc"
      risk_level: "low"

    malfind_dilution:
      enabled: false             # Extended scope only
      scope: "extended"
      n_regions_range: [2, 10]
      target_features:
        - "malfind.ninjections"
        - "malfind.commitCharge"
      risk_level: "high"

# --- Phase 0: Feasibility Gate ---
phase0:
  vm_type: "local"               # local KVM/QEMU (no cloud spend)
  simulated_truncation: true
  go_nogo_criteria:
    criterion_1:
      name: "functionality_preservation"
      description: "Primitives preserve malicious functionality"
      min_pass_ratio: 0.889      # ≥ 8/9 combinations
    criterion_2:
      name: "feature_shift_accuracy"
      description: "Feature deltas match predictions"
      min_pass_ratio: 0.80       # ≥ 80% of samples
    criterion_3:
      name: "evasion_efficacy"
      description: "At least one combination reduces f_θ(x) by ≥ threshold"
      min_probability_drop: 0.1  # ≥ 0.1 in soft-voting probability
      max_query_budget: 50
  malware_families_per_category: 3  # minimum for Phase 0

# --- Experimental Design ---
experiment:
  malware_categories: ["Ransomware", "Spyware", "Trojan"]
  families_per_category: [3, 5]  # min, max
  cloud_providers: ["aws", "gcp"]
  repetitions_per_cell: 5
  conditions: ["clean", "adversarial"]

# --- Evaluation Metrics ---
metrics:
  primary:
    - accuracy
    - f1_score
    - precision
    - recall
    - false_positive_rate
    - false_negative_rate
  adversarial:
    - evasion_success_rate
    - interaction_effect_delta
    - soft_vote_probability_drop
  shap:
    - global_feature_importance
    - spearman_rho
    - rank_instability_count        # features with rank change ≥ 10
  extended:
    - time_to_first_reliable_detection
    - per_classifier_robustness_ranking

# --- Statistical Framework ---
statistics:
  bootstrap:
    n_resamples: 1000
    confidence_level: 0.95
    method: "percentile"
  hypothesis_tests:
    alpha: 0.05
    direction: "one-sided"         # degradation direction is predicted
    correction: "bonferroni"       # across truncation levels
  effect_sizes:
    - cohens_d
    - cliffs_delta

# --- SHAP Explainability ---
shap_config:
  explainer: "TreeExplainer"
  n_background_samples: 100       # for KernelSHAP fallback
  feature_importance_method: "mean_abs_shap"
  rank_correlation_metric: "spearman"
  fragile_feature_threshold: 10   # rank change ≥ 10 positions

# --- Logging ---
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} | {message}"
  rotation: "10 MB"
  retention: "30 days"
  log_dir: "logs"

# --- Paths ---
paths:
  data_dir: "data"
  raw_dumps: "data/raw_dumps"
  features: "data/features"
  predictions: "data/predictions"
  shap_values: "data/shap_values"
  metadata: "data/metadata"
  timing_logs: "data/timing_logs"
  results_dir: "results"
  figures_dir: "results/figures"
  tables_dir: "results/tables"
  models_dir: "models"
  samples_dir: "samples"
